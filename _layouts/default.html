<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }} — Mukesh Gupta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">Mukesh Gupta</a>
      <nav class="site-nav" id="siteNav">
        <a href="{{ '/' | relative_url }}"        class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
        <a href="{{ '/about' | relative_url }}"   class="nav-link {% if page.url contains 'about' %}active{% endif %}">About</a>
        <a href="{{ '/skills' | relative_url }}"  class="nav-link {% if page.url contains 'skills' %}active{% endif %}">Skills</a>
        <a href="{{ '/projects' | relative_url }}" class="nav-link {% if page.url contains 'projects' %}active{% endif %}">Projects</a>
        <a href="{{ '/resume' | relative_url }}"  class="nav-link {% if page.url contains 'resume' %}active{% endif %}">Resume</a>
      </nav>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>
    </div>
  </header>

  <main class="site-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ 'now' | date: "%Y" }} Mukesh Gupta &mdash;
      <a href="https://www.linkedin.com/in/mukesh-gupta-847a54105/" target="_blank" rel="noopener">LinkedIn</a>
      &mdash;
      <a href="https://github.com/mukeshguptakc" target="_blank" rel="noopener">GitHub</a>
    </p>
  </footer>

  <script>
    const toggle = document.getElementById('navToggle');
    const nav = document.getElementById('siteNav');
    toggle.addEventListener('click', () => nav.classList.toggle('open'));
  </script>

</body>
</html>
